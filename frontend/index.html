<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | GBTAC</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("gbtacTheme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="styles.css?v=entra-auth-1" />
  </head>
  <body class="auth-page">
    <header class="topbar auth-topbar">
      <div class="topbar-title">
        <span class="wordmark topbar-wordmark" aria-label="GBTAC">GBTAC</span>
      </div>
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="Switch to dark mode"
      >
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-label">Dark mode</span>
      </button>
    </header>

    <main class="auth-container">
      <section class="auth-form entra-login-card" aria-labelledby="loginHeading">
        <p class="auth-provider-label">Microsoft Entra ID</p>
        <h1 id="loginHeading" class="login-heading">Welcome</h1>
        <p class="auth-subtitle">
          Sign in with the Microsoft account assigned to the GBTAC dashboard.
        </p>

        <button
          id="microsoftSignInButton"
          type="button"
          class="btn btn-primary microsoft-signin-button"
        >
          Sign in with Microsoft
        </button>

        <button
          id="microsoftSignOutButton"
          type="button"
          class="btn btn-secondary"
          hidden
        >
          Sign out and use another account
        </button>

        <p id="loginStatus" class="validation-message" role="status">
          Loading Microsoft sign-in…
        </p>

        <p class="auth-security-note">
          Access is controlled by the Viewer and Operator roles assigned in
          Microsoft Entra ID.
        </p>
      </section>
    </main>

    <footer class="site-footer auth-footer"></footer>
    <script src="config.js?v=entra-auth-1"></script>
    <script type="module" src="script.js?v=entra-auth-1"></script>
    <script type="module" src="login.js?v=entra-auth-1"></script>
  </body>
</html>
