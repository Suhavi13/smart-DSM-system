<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | GBTAC</title>
    <!-- Load the saved theme before CSS so dark/light mode appears immediately. -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("gbtacTheme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="styles.css?v=viewer-signup-1" />
  </head>
  <body class="auth-page">
    <!-- Authentication header shared by sign-in and signup pages. -->
    <header class="topbar auth-topbar">
      <div class="topbar-title">
        <span class="wordmark topbar-wordmark" aria-label="GBTAC">GBTAC</span>
      </div>
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="Switch to dark mode"
      >
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-label">Dark mode</span>
      </button>
    </header>

    <main class="auth-container">
      <!-- Sign-in form layout; signin.js handles validation and redirects. -->
      <form id="loginForm" class="auth-form" aria-labelledby="loginHeading">
        <h1 id="loginHeading" class="login-heading">Welcome</h1>

        <!-- User credentials. -->
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          maxlength="320"
          placeholder="name@example.com"
          required
          autofocus
        />

        <label for="password">Password</label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="1024"
            placeholder="Enter your password"
            required
          />
          <!-- Press and hold the eye icon to reveal the password temporarily. -->
          <button
            type="button"
            class="password-toggle"
            data-password-toggle
            data-target="password"
            aria-label="Show password"
          >
            &#128065;
          </button>
        </div>

        <a href="signup.html" class="auth-link-button forgot-password-button">
          Forgot password?
        </a>

        <!-- Random text captcha shown before the user submits the form. -->
        <label for="captchaInput">Enter the text below</label>
        <div class="captcha-row">
          <div
            id="captchaChallenge"
            class="captcha-challenge"
            aria-live="polite"
          ></div>
          <button
            id="captchaRefresh"
            type="button"
            class="captcha-refresh"
            aria-label="Generate a new captcha"
          >
            &#8635;
          </button>
        </div>
        <input
          id="captchaInput"
          name="captcha"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Enter captcha text"
          required
        />

        <button id="loginButton" type="submit" class="btn btn-primary">
          Sign in
        </button>

        <!-- Live status text used for validation errors and redirect messages. -->
        <p id="loginStatus" class="validation-message" role="status"></p>
        <p class="auth-security-note">
          New users are automatically registered as Viewers.
        </p>
        <p class="auth-switch-link">
          Need an account? <a href="signup.html">Create a Viewer account</a>
        </p>
      </form>
    </main>

    <footer class="site-footer auth-footer"></footer>
    <!-- Shared theme script first, then sign-in page behavior. -->
    <script src="config.js?v=viewer-signup-1"></script>
    <script type="module" src="script.js?v=viewer-signup-1"></script>
    <script type="module" src="signin.js?v=viewer-signin-2"></script>
  </body>
</html>
