<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | GBTAC</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("gbtacTheme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="styles.css?v=firebase-auth-1" />
  </head>
  <body class="auth-page">
    <header class="topbar auth-topbar">
      <div class="topbar-title">
        <span class="wordmark topbar-wordmark" aria-label="GBTAC">GBTAC</span>
      </div>
      <button
        type="button"
        class="theme-toggle"
        data-theme-toggle
        aria-label="Switch to dark mode"
      >
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-label">Dark mode</span>
      </button>
    </header>

    <main class="auth-container">
      <form
        id="forgotPasswordForm"
        class="auth-form"
        aria-labelledby="resetHeading"
      >
        <h1 id="resetHeading" class="login-heading">Reset password</h1>
        <p class="auth-security-note">
          Enter the email used for your Firebase account.
        </p>

        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="320"
          placeholder="name@example.com"
          required
          autofocus
        />

        <button id="resetButton" type="submit" class="btn btn-primary">
          Send reset email
        </button>
        <p id="resetStatus" class="validation-message" role="status"></p>
        <p class="auth-switch-link">
          Remembered your password? <a href="index.html">Return to sign in</a>
        </p>
      </form>
    </main>

    <footer class="site-footer auth-footer">
      <p class="site-footer-note">Note: All data provided is for informational and educational purposes only.</p>
    </footer>
    <script src="config.js?v=firebase-auth-1"></script>
    <script type="module" src="script.js?v=firebase-auth-1"></script>
    <script type="module" src="forgot-password.js?v=firebase-auth-1"></script>
  </body>
</html>
