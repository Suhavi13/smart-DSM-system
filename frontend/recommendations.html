<!doctype html>
<html lang="en">
  <head>
    <!-- Recommendation page metadata and persistent theme initialization -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GBTAC recommendations</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("gbtacTheme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("gbtacTheme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="styles.css?v=decision-reset-1" />
  </head>
  <body data-required-role="Operator">
    <!-- Shared application header and primary navigation -->
    <header class="topbar">
      <div class="topbar-title">
        <span class="wordmark topbar-wordmark" aria-label="GBTAC">GBTAC</span>
      </div>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="sensors.html">Sensors</a>
        <a href="recommendations.html" class="active">Recommendations</a>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-label="Switch to dark mode"
        >
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          <span class="theme-toggle-label">Dark mode</span>
        </button>
        <span class="auth-role-badge" data-auth-user-role>Loading role…</span>
        <button type="button" class="btn btn-secondary" data-sign-out>
          Log out
        </button>
      </nav>
    </header>

    <!-- Explainable building recommendations loaded from the backend -->
    <main class="page-layout recommendations-page">
      <!-- Page heading and summary text update when recommendations load. -->
      <section class="dashboard-heading">
        <div>
          <!-- <p class="dashboard-eyebrow">Phase 5 recommendation service</p> -->
          <h1>Recommendations</h1>
          <p id="recommendationSummary">Evaluating rules&hellip;</p>
        </div>
      </section>

      <!-- Notice area explains what data source the recommendation cards use. -->
      <p id="recommendationDataNotice" class="recommendation-data-notice">
        Sensor evidence is loaded from the recommendation API.
      </p>

      <!-- recommendations.js replaces this loading message with cards. -->
      <section
        id="recommendationList"
        class="recommendation-list"
        aria-label="Building recommendations"
      >
        <p class="recommendation-loading" role="status">
          Loading recommendations&hellip;
        </p>
      </section>
    </main>

    <!-- Shared footer and recommendation decision scripts -->
    <footer class="site-footer"><p></p></footer>
    <script src="config.js?v=6"></script>
    <script type="module" src="api.js?v=6"></script>
    <script type="module" src="script.js?v=6"></script>
    <script type="module" src="recommendations.js?v=decision-reset-1"></script>
    <script type="module" src="decisions.js?v=decision-reset-1"></script>
    <script type="module" src="auth-ui.js?v=firebase-auth-1"></script>
  </body>
</html>
